<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/index.css">
    <title>Sudoku by obsessixn</title>
</head>
<body>
    <section id="interfaz-main">
        <header id="interfaz-main.LoginUser">
            <section id="interfaz-main.Content" class="interfaz-mainContent">
                    <label id="login-label" class="login-labelUser">
                        <div>
                            <img class="img-user" src="./Desing/image-2.png" alt="User Icon">
                        </div>
                        <p>User</p>
                    </label>
            </section>
        </header>
        <section class="interfaz-mainTittle" id="interfaz-main.tittle">
            <h1>SUDOKU</h1>
        </section>
        <section class="interfaz-mainOptions" id="interfaz-main.options">
            <div id="interfaz-main.options.start">
                <button id="Button-Start">
                    START
                </button>
            </div>
            <div id="interfaz-main.options.tips">
                <button id="Button-Tips">
                    TIPS
                </button>
            </div>
            <div id="interfaz-main.options.options">
                <button id="Button-Options">
                    OPTIONS
                </button>
            </div>
            <div id="interfaz-main.options.exit">
                <button id="Button-Exit">
                    EXIT GAME
                </button>
            </div>
        </section>
    </section>
</body>
<script src="./js/index.js"></script>
</html>
