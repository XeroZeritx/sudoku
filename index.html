<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku by obsessixn</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <!-- User Profile Section -->
    <header class="user-profile">
        <a href="profile-user.html" class="user-info">
            <div class="user-image">
                <img src="./Desing/Sukuna.jpeg" alt="User Icon">
            </div>
            <div class="user-name">
                <p>UserName</p>
            </div>
        </a>
    </header>

    <!-- Title Section -->
    <section class="tittle-game">
        <h1>SUDOKU</h1>
    </section>

    <!-- Options buttons Section -->
    <section class="menu-options">
        <div id="menu-options-startgame">
            <button id="button-start">
                START
            </button>
        </div>
        <div id="menu-options-tips">
            <button id="button-tips">
                TIPS
            </button>
        </div>
        <div id="menu-options-settings">
            <button id="button-settings">
                OPTIONS
            </button>
        </div>
        <div id="menu-options-exit">
            <button id="button-exit">
                EXIT GAME
            </button>
        </div>
    </section>
</body>
<script src="./js/index.js"></script>
</html>
