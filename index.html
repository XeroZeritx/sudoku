<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku by obsessixn</title>
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/resposive.css">
</head>
<body>
    <!-- User Profile Section -->
    <header class="user-profile">
        <a href="profile-user.html" class="user-info">
            <div class="user-image">
                <img src="./Desing/image-2.png" alt="User Icon">
            </div>
            <div class="user-name">
                <p>UserName</p>
            </div>
        </a>
    </header>

    <!-- Title Section -->
    <section class="interfaz-mainTittle" id="interfaz-main.tittle">
        <h1>SUDOKU</h1>
    </section>

    <!-- Options Section -->
    <section class="interfaz-mainOptions" id="interfaz-main.options">
        <div id="interfaz-main.options.start">
            <button id="Button-Start">
                START
            </button>
        </div>
        <div id="interfaz-main.options.tips">
            <button id="Button-Tips">
                TIPS
            </button>
        </div>
        <div id="interfaz-main.options.options">
            <button id="Button-Options">
                OPTIONS
            </button>
        </div>
        <div id="interfaz-main.options.exit">
            <button id="Button-Exit">
                EXIT GAME
            </button>
        </div>
    </section>
</body>
<script src="./js/index.js"></script>
</html>
