<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Level of Sudoku</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/difficulty.css">
    <script src="./js/select-difficulty.js" defer></script>
</head>
<body>
    <main class="select-difficulty">
        <div class="select-difficulty-content">
            <h1>Select Difficulty</h1>
            <div class="select-difficulty-options">
                <button id="easy-difficulty" type="button">
                    Easy
                </button>
                <button id="mid-difficulty" type="button">
                    Medium
                </button>
                <button id="hard-difficulty" type="button">
                    Hard
                </button>
            </div>
        </div>
    </main>
</body>
</html>
