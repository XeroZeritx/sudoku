<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/juego.css">
</head>
<body>
    <!-- Options during the game -->
    <main class="game-options">
        <button id="new-game-button_options">New Game</button>
    </main>

    <!-- Sudoku board-->
    <div class="board" id="board">
    </div>

    <!-- Section when you lost the game  -->
    <div id="game-over-modal">
    <div class="game-over-content">
        <h2>Game Over</h2>
        <p>You have made 3 mistakes.</p>
        <button id="retry-button">Retry</button>
        <button id="new-game-button_modal">New Game</button>
    </div>
</div>
</body>
<script src="./js/game-data.js"></script>
<script src="./js/validations.js"></script>
<script src="./js/generate_sudoku.js"></script>
<script src="./js/board.js"></script>
<script src="./js/game.js"></script>
</html>
